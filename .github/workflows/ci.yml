name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Analisar o codigo com Semgrep
        run: semgrep scan --config auto --error src

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar o projeto
        run: npm run build

  lint-quality:
    name: Lint & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

      - name: Verificar formatacao com Prettier
        run: npm run format:check

  tests:
    name: Testes unitarios
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar o Prisma Client
        run: npx prisma generate

      - name: Executar testes e medir cobertura
        run: npm run test:coverage
