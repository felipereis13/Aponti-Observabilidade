name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: observabilidade-api

jobs:
  docker:
    name: Build e Push Docker
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo aprovado pelo CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}

  terraform:
    name: Provisionar EC2 no LocalStack
    needs: docker
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: cmd
    outputs:
      instance_id: ${{ steps.terraform-output.outputs.instance_id }}

    steps:
      - name: Baixar o codigo aprovado pelo CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: false

      - name: Iniciar LocalStack
        run: docker compose -f docker-compose.localstack.yml up -d

      - name: Aguardar LocalStack
        run: |
          @echo off
          for /L %%i in (1,1,30) do (
            curl --fail --silent http://localhost:4566/_localstack/health >nul 2>&1
            if not errorlevel 1 goto localstack_ready
            echo LocalStack ainda nao esta pronto: tentativa %%i de 30
            ping 127.0.0.1 -n 6 >nul
          )
          echo LocalStack nao iniciou corretamente.
          exit /b 1
          :localstack_ready
          echo LocalStack pronto.

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Validar Terraform
        working-directory: terraform
        run: |
          terraform init || exit /b 1
          terraform fmt -check || exit /b 1
          terraform validate || exit /b 1

      - name: Provisionar EC2
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Obter ID da EC2
        id: terraform-output
        working-directory: terraform
        run: |
          for /f "delims=" %%i in ('terraform output -raw instance_id') do set "INSTANCE_ID=%%i"
          if not defined INSTANCE_ID exit /b 1
          echo instance_id=%INSTANCE_ID%>>"%GITHUB_OUTPUT%"

  deploy:
    name: Deploy local
    needs: [docker, terraform]
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: cmd
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/observabilidade-api:${{ github.event.workflow_run.head_sha }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

    steps:
      - name: Baixar o codigo aprovado pelo CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: false

      - name: Mostrar EC2 provisionada
        run: |
          echo EC2 criada no LocalStack: ${{ needs.terraform.outputs.instance_id }}

      - name: Executar aplicacao atualizada
        run: |
          docker compose -f docker-compose.prod.yml pull || exit /b 1
          docker compose -f docker-compose.prod.yml up -d --remove-orphans || exit /b 1

      - name: Verificar deploy
        run: |
          @echo off
          for /L %%i in (1,1,20) do (
            curl --fail --silent http://localhost:3000/health >nul 2>&1
            if not errorlevel 1 goto deploy_ready
            ping 127.0.0.1 -n 6 >nul
          )
          echo A API nao respondeu depois do deploy.
          exit /b 1
          :deploy_ready
          echo Deploy concluido: http://localhost:3000
          echo Grafana: http://localhost:3001
