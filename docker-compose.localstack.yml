services:
  localstack:
    container_name: localstack-main
    image: localstack/localstack:3.8
    ports:
      - '127.0.0.1:4566:4566'
      - '127.0.0.1:4510-4559:4510-4559'
    environment:
      SERVICES: ec2
      EC2_VM_MANAGER: docker
      PERSISTENCE: 1
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  localstack_data:
